<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>금 시세 확인판</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --bg: #171310;
    --panel: #211B15;
    --panel-2: #2A2118;
    --line: #382F24;
    --text: #EDE4D3;
    --text-muted: #9C8F79;
    --gold: #C9A15A;
    --stale: #C97A3D;
    --fail: #B4472E;
    --serif: "Source Serif 4", serif;
    --sans: "IBM Plex Sans KR", "IBM Plex Sans", sans-serif;
    --mono: "IBM Plex Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.6; }
  a { color: var(--gold); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 56px; }

  header { padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  header h1 { font-size: 17px; font-weight: 500; margin: 0; }
  header .sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px; margin-bottom: 18px; }
  .panel h2 { font-size: 12px; color: var(--text-muted); font-weight: 500; margin: 0 0 10px; }

  #chart-empty { font-size: 13px; color: var(--text-muted); padding: 20px 0; text-align: center; }

  .banner {
    border: 1px solid var(--fail); border-radius: 4px; padding: 12px 14px; margin-bottom: 16px;
    font-size: 13px;
  }
  .banner .msg { color: var(--fail); margin-bottom: 8px; }
  .banner .action-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .banner button, .banner a.btn {
    font-family: var(--sans); font-size: 12px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 3px; padding: 6px 12px; cursor: pointer; text-decoration: none;
    display: inline-block;
  }
  .banner button:hover, .banner a.btn:hover { border-color: var(--text-muted); }
  .banner .countdown { font-family: var(--mono); font-size: 12px; color: var(--stale); }

  .value-label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .value-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .value { font-family: var(--serif); font-size: 34px; font-weight: 600; color: var(--gold); }
  .value.dim { color: var(--text-muted); }
  .unit { font-size: 12px; color: var(--text-muted); }
  .delta { font-family: var(--mono); font-size: 13px; }
  .delta.up { color: var(--gold); }
  .delta.down { color: var(--fail); }
  .delta.flat { color: var(--text-muted); }

  .timegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; font-size: 12px; }
  @media (max-width: 480px) { .timegrid { grid-template-columns: 1fr; } }
  .timegrid .box { border: 1px solid var(--line); border-radius: 4px; padding: 9px 11px; }
  .timegrid .lab { color: var(--text-muted); font-size: 11px; margin-bottom: 3px; }

  .lastgood { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--stale); }

  .log-row {
    display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono);
    font-size: 12px; padding: 7px 0; border-bottom: 1px solid var(--line);
  }
  .log-row:last-child { border-bottom: none; }
  .log-row .d { color: var(--text-muted); }
  .log-row .v.ok { color: var(--gold); }
  .log-row .v.fail { color: var(--fail); }

  footer { font-size: 11px; color: var(--text-muted); padding-top: 8px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>금 시세 확인판</h1>
    <div class="sub">금(XAU) 1트로이온스 · KRW 기준</div>
  </header>

  <div class="panel">
    <h2>일별 시세 추이</h2>
    <div id="chart-holder"></div>
  </div>

  <div class="panel" id="value-panel">
    <div id="banner-holder"></div>
    <div class="value-label" id="value-date-label">확인된 값</div>
    <div class="value-row">
      <span class="value" id="hero-value">—</span>
      <span class="unit" id="hero-unit"></span>
    </div>
    <div class="delta" id="hero-delta"></div>

    <div class="timegrid">
      <div class="box">
        <div class="lab">출처 시각</div>
        <div id="source-time">—</div>
      </div>
      <div class="box">
        <div class="lab">조회 시각</div>
        <div id="fetch-time">—</div>
      </div>
    </div>

    <div class="lastgood" id="lastgood-box" style="display:none;"></div>
  </div>

  <div class="panel">
    <h2>일별 기록 로그</h2>
    <div id="log-body">불러오는 중…</div>
  </div>

  <footer>
    출처: <a href="https://goldprice.dev" target="_blank" rel="noopener">goldprice.dev</a>
  </footer>

</div>

<script>
// 공식 오류 코드 체계 (reading-status.schema.json과 동일):
// freshness: fresh | stale
// error_code: none | timeout | auth | rate_limit | offline | schema_error
const STATUS_LABEL = {
  none: "정상", timeout: "타임아웃", auth: "거절(401/403)",
  rate_limit: "호출 제한", offline: "오프라인", schema_error: "형식 변경",
};

const UNIT_DISPLAY = { "KRW/ozt": "KRW / 1 트로이온스(XAU)" };

const FAILURE_INFO = {
  timeout: { msg: "출처 응답이 느립니다.", action: "actions_link" },
  offline: { msg: "네트워크에 연결할 수 없습니다.", action: "actions_link" },
  auth: { msg: "출처가 요청을 거부했습니다. 재시도해도 바로 해결되지 않습니다.", action: "link" },
  rate_limit: { msg: "호출 한도를 초과했습니다. 시간이 지나면 자동으로 풀립니다.", action: "actions_link_countdown" },
  schema_error: { msg: "출처 응답 형식이 바뀐 것 같습니다. 자동 복구가 어려울 수 있습니다.", action: "report" },
};

// goldprice.dev는 브라우저 직접 호출(CORS)을 허용하지 않는다 — 실측으로 확인됨.
// 그래서 "다시 시도"는 브라우저에서 재조회를 시도하는 대신, 이 페이지의 실제
// 저장소 Actions 페이지로 이동하는 링크로 대신한다 (거기서 재수집이 실제로 가능하다).
function repoActionsUrl() {
  try {
    const account = location.hostname.split(".")[0];
    const repo = location.pathname.split("/").filter(Boolean)[0];
    if (!account || !repo) return null;
    return `https://github.com/${account}/${repo}/actions`;
  } catch {
    return null;
  }
}

let STATE = null;

function fmtWon(n) {
  return n === null || n === undefined ? "—" : Math.round(n).toLocaleString("ko-KR");
}
function fmtWonK(n) {
  return "₩" + Math.round(n / 1000).toLocaleString("ko-KR") + "천";
}
function toKst(utcLike) {
  if (!utcLike) return "—";
  const d = new Date(utcLike);
  if (isNaN(d.getTime())) return utcLike;
  return d.toLocaleString("ko-KR", { timeZone: "Asia/Seoul", hour12: false }) + " (KST, UTC+9)";
}
function daysBetweenKst(dateStrA, dateStrB) {
  const a = new Date(dateStrA + "T00:00:00Z");
  const b = new Date(dateStrB + "T00:00:00Z");
  return Math.round((b - a) / 86400000);
}

function renderChart() {
  const holder = document.getElementById("chart-holder");
  const runLog = (STATE && STATE.run_log) || [];
  const okPoints = runLog.filter((r) => r.outcome === "success");
  if (okPoints.length === 0) {
    holder.innerHTML = '<div id="chart-empty">표시할 정상 기록이 아직 없습니다.</div>';
    return;
  }
  const values = okPoints.map((r) => r.normalized_value);
  const min = Math.min(...values);
  const max = Math.max(...values);
  const span = max - min || 1;

  const n = runLog.length;
  const marginL = 74, marginR = 20, top = 20, bottom = 110;
  const xFor = (i) => (n <= 1 ? (marginL + 580) / 2 : marginL + ((580 - marginR - marginL) * i) / (n - 1));
  const yFor = (v) => bottom - ((v - min) / span) * (bottom - top);

  let svg = `<svg viewBox="0 0 600 160" style="width:100%;height:auto;" role="img" aria-label="일별 금 시세 추이 그래프">`;
  [top, (top + bottom) / 2, bottom].forEach((y, idx) => {
    const v = max - (idx * span) / 2;
    svg += `<line x1="${marginL}" y1="${y}" x2="580" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    svg += `<text x="${marginL - 8}" y="${y + 4}" fill="var(--text-muted)" font-size="10" font-family="IBM Plex Mono, monospace" text-anchor="end">${fmtWonK(v)}</text>`;
  });

  for (let i = 0; i < n - 1; i++) {
    const a = runLog[i], b = runLog[i + 1];
    if (a.outcome !== "success" || b.outcome !== "success") continue;
    svg += `<line x1="${xFor(i)}" y1="${yFor(a.normalized_value)}" x2="${xFor(i + 1)}" y2="${yFor(b.normalized_value)}" stroke="var(--gold)" stroke-width="2"/>`;
  }
  for (let i = 0; i < n; i++) {
    if (runLog[i].outcome === "success") continue;
    let prevOk = -1, nextOk = -1;
    for (let j = i - 1; j >= 0; j--) if (runLog[j].outcome === "success") { prevOk = j; break; }
    for (let j = i + 1; j < n; j++) if (runLog[j].outcome === "success") { nextOk = j; break; }
    if (prevOk >= 0) svg += `<line x1="${xFor(prevOk)}" y1="${yFor(runLog[prevOk].normalized_value)}" x2="${xFor(i)}" y2="${(yFor(runLog[prevOk].normalized_value) + (nextOk >= 0 ? yFor(runLog[nextOk].normalized_value) : yFor(runLog[prevOk].normalized_value))) / 2}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4,4"/>`;
    if (nextOk >= 0) svg += `<line x1="${xFor(i)}" y1="${(yFor(runLog[prevOk >= 0 ? prevOk : nextOk].normalized_value) + yFor(runLog[nextOk].normalized_value)) / 2}" x2="${xFor(nextOk)}" y2="${yFor(runLog[nextOk].normalized_value)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4,4"/>`;
  }

  runLog.forEach((r, i) => {
    const x = xFor(i);
    if (r.outcome === "success") {
      const y = yFor(r.normalized_value);
      const isLast = i === n - 1;
      svg += `<circle cx="${x}" cy="${y}" r="${isLast ? 4 : 3}" fill="var(--gold)"${isLast ? ' stroke="var(--bg)" stroke-width="1.5"' : ""}/>`;
      svg += `<text x="${x}" y="${y - 10}" fill="${isLast ? "var(--gold)" : "var(--text-muted)"}" font-size="9" font-family="IBM Plex Mono, monospace" text-anchor="middle">${fmtWonK(r.normalized_value)}</text>`;
    } else {
      const yMid = (top + bottom) / 2;
      svg += `<circle cx="${x}" cy="${yMid}" r="3" fill="none" stroke="var(--fail)" stroke-width="2"/>`;
      svg += `<text x="${x}" y="${bottom + 30}" fill="var(--fail)" font-size="9" font-family="IBM Plex Mono, monospace" text-anchor="middle">실패</text>`;
    }
    svg += `<text x="${x}" y="${bottom + 18}" fill="var(--text-muted)" font-size="10" font-family="IBM Plex Mono, monospace" text-anchor="middle">${r.record_date.slice(5)}</text>`;
  });

  svg += `</svg>`;
  holder.innerHTML = svg;
}

function renderLog() {
  const body = document.getElementById("log-body");
  const runLog = (STATE && STATE.run_log) || [];
  if (runLog.length === 0) {
    body.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">아직 기록이 없습니다.</div>';
    return;
  }
  body.innerHTML = [...runLog].reverse().map((r) => {
    const ok = r.outcome === "success";
    return `<div class="log-row">
      <span class="d">${r.record_date}</span>
      <span class="v ${ok ? "ok" : "fail"}">${ok ? fmtWon(r.normalized_value) + "원" : STATUS_LABEL[r.error_code] || r.error_code}</span>
    </div>`;
  }).join("");
}

function renderBanner() {
  const holder = document.getElementById("banner-holder");
  const status = STATE && STATE.status;
  if (!status || status.freshness === "fresh") { holder.innerHTML = ""; return; }
  const info = FAILURE_INFO[status.error_code] || { msg: "알 수 없는 오류", action: "actions_link" };
  const actionsUrl = repoActionsUrl();

  let actionHtml = "";
  if (info.action === "actions_link") {
    actionHtml = actionsUrl
      ? `<a class="btn" href="${actionsUrl}" target="_blank" rel="noopener">Actions에서 지금 다시 실행</a>`
      : `<span style="color:var(--text-muted);">다음 자동 수집(하루 1회)까지 기다려 주세요.</span>`;
  } else if (info.action === "link") {
    actionHtml = `<a class="btn" href="https://goldprice.dev/docs" target="_blank" rel="noopener">출처 문서 확인</a>`;
  } else if (info.action === "actions_link_countdown") {
    const retrySec = (STATE.last_run && STATE.last_run.retry_after_seconds) || 60;
    actionHtml = `<span class="countdown">약 ${retrySec}초 후 자동으로 풀릴 것으로 예상</span> ` + (actionsUrl
      ? `<a class="btn" href="${actionsUrl}" target="_blank" rel="noopener">지금 바로 확인하려면 Actions 열기</a>`
      : "");
  } else if (info.action === "report") {
    actionHtml = `<button id="report-btn">오류 세부정보 복사</button>`;
  }

  holder.innerHTML = `
    <div class="banner">
      <div class="msg">현재 값 확인 실패 (${STATUS_LABEL[status.error_code] || status.error_code}): ${info.msg}</div>
      <div class="action-row">${actionHtml}</div>
    </div>
  `;

  if (info.action === "report") {
    document.getElementById("report-btn").addEventListener("click", () => {
      const lr = STATE.last_run || {};
      const detail = `error_code=${status.error_code}\nvirtual_now=${lr.virtual_now}\noutcome=${lr.outcome}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(detail).then(() => {
          document.getElementById("report-btn").textContent = "복사됨";
        });
      }
    });
  }
}

function renderValue() {
  const current = STATE && STATE.current_reading;
  const status = STATE && STATE.status;
  const dateLabel = document.getElementById("value-date-label");
  const valueEl = document.getElementById("hero-value");
  const unitEl = document.getElementById("hero-unit");
  const deltaEl = document.getElementById("hero-delta");
  const sourceTimeEl = document.getElementById("source-time");
  const fetchTimeEl = document.getElementById("fetch-time");
  const lastGoodBox = document.getElementById("lastgood-box");

  renderBanner();

  if (!current) {
    dateLabel.textContent = "확인된 값 없음";
    valueEl.textContent = "—"; valueEl.classList.add("dim");
    unitEl.textContent = "";
    sourceTimeEl.textContent = "—"; fetchTimeEl.textContent = "—";
    lastGoodBox.style.display = "none";
    return;
  }

  const isFresh = status && status.freshness === "fresh";
  dateLabel.textContent = isFresh
    ? `${current.record_date} 기준 확인된 값`
    : `마지막으로 확인된 값 (${current.record_date} 기준)`;
  unitEl.textContent = `단위: ${UNIT_DISPLAY[current.unit] || current.unit}`;

  valueEl.textContent = fmtWon(current.normalized_value) + "원";
  valueEl.classList.toggle("dim", !isFresh);
  sourceTimeEl.textContent = toKst(current.source_time);
  fetchTimeEl.textContent = toKst(current.fetched_at);

  deltaEl.textContent = ""; deltaEl.className = "delta";
  const cmp = STATE.last_comparison;
  if (cmp && cmp.state === "comparable") {
    const readings = STATE.daily_readings || [];
    const idx = readings.findIndex((r) => r.record_date === current.record_date);
    const prev = idx > 0 ? readings[idx - 1] : null;
    const diff = cmp.direction === "increase" ? cmp.magnitude : cmp.direction === "decrease" ? -cmp.magnitude : 0;
    const sign = diff > 0 ? "+" : diff < 0 ? "" : "±";
    const pctText = prev && prev.normalized_value ? ` (${sign}${((diff / prev.normalized_value) * 100).toFixed(2)}%)` : "";
    const prevLabel = prev ? `전일(${prev.record_date}) 대비` : "이전 기록 대비";
    deltaEl.textContent = `${prevLabel} ${sign}${fmtWon(Math.abs(diff) === 0 ? 0 : diff)}원${pctText}`;
    deltaEl.classList.add(diff > 0 ? "up" : diff < 0 ? "down" : "flat");
  } else if (cmp && cmp.state === "unit_mismatch") {
    deltaEl.textContent = "단위가 달라 비교할 수 없음";
    deltaEl.classList.add("flat");
  } else {
    deltaEl.textContent = "비교할 이전 정상 기록 없음";
    deltaEl.classList.add("flat");
  }

  if (!isFresh) {
    const today = (STATE.last_run && STATE.last_run.virtual_now) ? STATE.last_run.virtual_now.slice(0, 10) : current.record_date;
    const days = daysBetweenKst(current.record_date, today);
    lastGoodBox.style.display = "block";
    lastGoodBox.textContent = `마지막 정상값 ${current.record_date} · ${fmtWon(current.normalized_value)}원 · ${days}일 지남`;
  } else {
    lastGoodBox.style.display = "none";
  }
}

async function init() {
  try {
    STATE = await fetch("data/state.json", { cache: "no-store" }).then((r) => r.json());
  } catch {
    STATE = null;
  }
  renderChart();
  renderValue();
  renderLog();
}

init();
</script>
</body>
</html>
